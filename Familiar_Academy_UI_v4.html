<style>
      :root {
        --bg-color: #1e1e2e;
        --panel-bg: #2a2a3c;
        --text-color: #cdd6f4;
        --border-color: #45475a;
        --accent-color: #89b4fa;
        --disabled-color: #6c7086;
      }
      #fa-app {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        display: flex;
        height: 650px;
        border-radius: 8px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }
      #fa-app .sidebar {
        width: 200px;
        background-color: var(--panel-bg);
        border-right: 1px solid var(--border-color);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
      }
      #fa-app .sidebar button {
        background: none;
        border: none;
        color: var(--text-color);
        padding: 15px 20px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        transition: background 0.2s, border-left 0.2s;
        border-left: 3px solid transparent;
      }
      #fa-app .sidebar button:hover {
        background-color: rgba(137, 180, 250, 0.1);
      }
      #fa-app .sidebar button.active {
        background-color: rgba(137, 180, 250, 0.2);
        border-left: 3px solid var(--accent-color);
        font-weight: bold;
      }
      #fa-app .content {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
      }
      #fa-app .page {
        display: none;
        max-width: 600px;
      }
      .page.active {
        display: block;
      }
      #fa-app h1 {
        font-size: 2.5em;
        margin-top: 0;
        color: var(--accent-color);
      }
      #fa-app h2 {
        font-size: 1.5em;
        margin-top: 0;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 10px;
      }
      #fa-app .subtitle {
        font-size: 0.9em;
        color: #a6adc8;
        margin-bottom: 20px;
      }
      #fa-app .form-group {
        margin-bottom: 20px;
      }
      #fa-app label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }
      #fa-app input, #fa-app select, #fa-app #fa-app textarea {
        width: 100%;
        padding: 10px;
        background-color: #181825;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        border-radius: 4px;
        box-sizing: border-box;
      }
      #fa-app textarea {
        resize: vertical;
        min-height: 80px;
      }
      #fa-app .radio-group {
        display: flex;
        gap: 20px;
        margin-bottom: 10px;
      }
      .radio-group #fa-app label {
        display: flex;
        align-items: center;
        font-weight: normal;
        cursor: pointer;
      }
      #fa-app .money-input-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #fa-app .money-input-group input {
        width: 150px;
        text-align: right;
      }
      #fa-app .btn {
        background-color: var(--border-color);
        color: var(--text-color);
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
      }
      #fa-app .btn:hover {
        background-color: #585b70;
      }
      #fa-app .btn:disabled {
        background-color: var(--border-color);
        color: var(--disabled-color);
        cursor: not-allowed;
      }
      #fa-app .inline-group {
        display: flex;
        gap: 10px;
      }
      #fa-app .actions {
        margin-top: 30px;
        display: flex;
        gap: 15px;
      }
      #fa-app .btn-primary {
        background-color: var(--accent-color);
        color: #11111b;
        font-weight: bold;
      }
      #fa-app .btn-primary:hover:not(:disabled) {
        background-color: #74c7ec;
      }
      #fa-app fieldset {
        border: none;
        padding: 0;
        margin: 0;
      }
      #fa-app fieldset:disabled {
        opacity: 0.4;
      }
      #fa-app .hidden {
        display: none !important;
      }
      #fa-app #summary-list {
        background-color: #181825;
        padding: 20px;
        border-radius: 4px;
        border: 1px solid var(--border-color);
      }
      #fa-app #summary-list p {
        margin: 10px 0;
      }
      #fa-app #summary-list strong {
        color: #a6e3a1;
      }
    </style>
<div id="fa-app">

    <div class="sidebar">
      <button class="nav-btn active" data-target="page1">第一頁：首頁</button>
      <button class="nav-btn" data-target="page2">第二頁：基本資料</button>
      <button class="nav-btn" data-target="page3">第三頁：契約對象</button>
      <button class="nav-btn" data-target="page4">第四頁：確認入學</button>
    </div>

    <div class="content">
      <!-- 第一頁 -->
      <div id="page1" class="page active">
        <h1>歡迎入學使魔學院</h1>
        <div class="form-group">
          <label>你真的是人類嗎？</label>
          <div class="radio-group">
            <label><input type="radio" name="race" value="human" checked onchange="window.FamiliarApp.updateRace()" /> 人類</label>
            <label><input type="radio" name="race" value="familiar" onchange="window.FamiliarApp.updateRace()" /> 使魔</label>
          </div>
          <div class="subtitle">備註: 根據是否是人類，將影響之後頁面的版本與顯示。</div>
        </div>
        <div class="form-group">
          <label>你的身分是？</label>
          <select id="role-select" onchange="window.FamiliarApp.updateRole()">
            <option value="新生">新生</option>
            <option value="高年級生">高年級生</option>
            <option value="教師">教師</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="form-group hidden" id="role-other-container">
          <label>請輸入其他身分：</label>
          <input type="text" id="role-other-input" placeholder="例如：校外工友" />
        </div>
      </div>

      <!-- 第二頁 (人類版) -->
      <div id="page2-human" class="page">
        <h2>基本資料 (人類)</h2>
        <div class="form-group"><label>名字</label><input type="text" id="h-name" /></div>
        <div class="form-group">
          <label>性別</label>
          <div class="inline-group">
            <select id="h-gender" onchange="window.FamiliarApp.checkGenderOther(this, 'h-gender-other')">
              <option>男</option><option>女</option><option>其他</option>
            </select>
            <input type="text" id="h-gender-other" class="hidden" placeholder="請輸入自訂性別" />
          </div>
        </div>
        <div class="form-group"><label>人設</label><textarea id="h-persona"></textarea></div>
        <div class="form-group grade-container hidden">
          <label>年級</label>
          <select id="h-grade">
            <option>二</option><option>三</option><option>四</option><option>五</option><option>六</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始金錢 (藝齒)</label>
          <div class="money-input-group">
            <button class="btn" onclick="window.FamiliarApp.changeMoney('h-money', -100)">-</button>
            <input type="number" id="h-money" value="0" min="0" step="100" />
            <button class="btn" onclick="window.FamiliarApp.changeMoney('h-money', 100)">+</button>
          </div>
        </div>
        <div class="form-group"><label>當前狀態</label><input type="text" id="h-status" /></div>
        <div class="form-group">
          <label>契約使魔</label>
          <select id="h-contract" onchange="window.FamiliarApp.updateContract()">
            <option value="有">有</option><option value="無">無</option>
          </select>
        </div>
      </div>

      <!-- 第二頁 (使魔版) -->
      <div id="page2-familiar" class="page">
        <h2>基本資料 (使魔)</h2>
        <div class="form-group">
          <label>名字 (稱號 與 姓名)</label>
          <div class="inline-group">
            <input type="text" id="f-title" placeholder="稱號" />
            <input type="text" id="f-name" placeholder="姓名" />
          </div>
        </div>
        <div class="form-group">
          <label>屬性</label>
          <select id="f-element">
            <option>地</option><option>水</option><option>炎</option><option>風</option><option>光</option><option>闇</option>
          </select>
        </div>
        <div class="form-group">
          <label>種族</label>
          <select id="f-race-type">
            <option>惡魔</option><option>天使</option><option>機械</option><option>龍</option><option>植物</option>
            <option>爬蟲</option><option>昆蟲</option><option>不死</option><option>雷族</option><option>炎族</option>
            <option>水族</option><option>海龍</option><option>鳥獸</option><option>獸族</option><option>魚族</option>
            <option>幻龍</option><option>恐龍</option><option>魔法使族</option><option>戰士族</option>
          </select>
        </div>
        <div class="form-group"><label>星級或階級 (用於分類)</label><input type="text" id="f-star" placeholder="例如：1星、階級1" /></div>
        <div class="form-group">
          <label>性別</label>
          <div class="inline-group">
            <select id="f-gender" onchange="window.FamiliarApp.checkGenderOther(this, 'f-gender-other')">
              <option>男</option><option>女</option><option>無</option><option>其他</option>
            </select>
            <input type="text" id="f-gender-other" class="hidden" placeholder="請輸入自訂性別" />
          </div>
        </div>
        <div class="form-group"><label>人設</label><textarea id="f-persona"></textarea></div>
        <div class="form-group grade-container hidden">
          <label>年級</label>
          <select id="f-grade">
            <option>二</option><option>三</option><option>四</option><option>五</option><option>六</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始金錢 (藝齒)</label>
          <div class="money-input-group">
            <button class="btn" onclick="window.FamiliarApp.changeMoney('f-money', -100)">-</button>
            <input type="number" id="f-money" value="0" min="0" step="100" />
            <button class="btn" onclick="window.FamiliarApp.changeMoney('f-money', 100)">+</button>
          </div>
        </div>
        <div class="form-group"><label>當前狀態</label><input type="text" id="f-status" /></div>
        <div class="form-group">
          <label>契約召喚者</label>
          <select id="f-contract" onchange="window.FamiliarApp.updateContract()">
            <option value="有">有</option><option value="無">無</option>
          </select>
        </div>
      </div>

      <!-- 第三頁 (人類版) -->
      <div id="page3-human" class="page">
        <h2>你的使魔</h2>
        <div class="subtitle">之前選有使魔但這裡沒填，會給你隨機使魔</div>
        <fieldset id="fs-h-contract">
          <div class="form-group">
            <label>名字 (稱號 與 姓名)</label>
            <div class="inline-group">
              <input type="text" id="ch-title" placeholder="稱號" />
              <input type="text" id="ch-name" placeholder="姓名" />
            </div>
          </div>
          <div class="form-group">
            <label>屬性</label>
            <select id="ch-element">
              <option>地</option><option>水</option><option>炎</option><option>風</option><option>光</option><option>闇</option>
            </select>
          </div>
          <div class="form-group">
            <label>種族</label>
            <select id="ch-race-type">
              <option>惡魔</option><option>天使</option><option>機械</option><option>龍</option><option>植物</option>
              <option>爬蟲</option><option>昆蟲</option><option>不死</option><option>雷族</option><option>炎族</option>
              <option>水族</option><option>海龍</option><option>鳥獸</option><option>獸族</option><option>魚族</option>
              <option>幻龍</option><option>恐龍</option><option>魔法使族</option><option>戰士族</option>
            </select>
          </div>
          <div class="form-group"><label>星級或階級 (用於分類)</label><input type="text" id="ch-star" placeholder="例如：1星、低階" /></div>
          <div class="form-group">
            <label>性別</label>
            <div class="inline-group">
              <select id="ch-gender" onchange="window.FamiliarApp.checkGenderOther(this, 'ch-gender-other')">
                <option>男</option><option>女</option><option>無</option><option>其他</option>
              </select>
              <input type="text" id="ch-gender-other" class="hidden" placeholder="請輸入自訂性別" />
            </div>
          </div>
          <!-- 新增：為第三情境能填入生成的使魔設定而加入的欄位 -->
          <div class="form-group"><label>人設與背景</label><textarea id="ch-persona"></textarea></div>
        </fieldset>
      </div>

      <!-- 第三頁 (使魔版) -->
      <div id="page3-familiar" class="page">
        <h2>你的召喚者</h2>
        <div class="subtitle">之前選有召喚者但這裡沒填，會給你生成召喚者</div>
        <fieldset id="fs-f-contract">
          <div class="form-group"><label>名字</label><input type="text" id="cf-name" /></div>
          <div class="form-group">
            <label>性別</label>
            <div class="inline-group">
              <select id="cf-gender" onchange="window.FamiliarApp.checkGenderOther(this, 'cf-gender-other')">
                <option>男</option><option>女</option><option>其他</option>
              </select>
              <input type="text" id="cf-gender-other" class="hidden" placeholder="請輸入自訂性別" />
            </div>
          </div>
          <div class="form-group"><label>人設</label><textarea id="cf-persona"></textarea></div>
          <div class="form-group"><label>身分</label><input type="text" id="cf-role" /></div>
        </fieldset>
      </div>

      <!-- 第四頁 -->
      <div id="page4" class="page">
        <h2>確認個人資料</h2>
        <div id="summary-list"></div>
        <div class="form-group" style="margin-top: 25px;">
          <label style="display:inline-block; margin-right: 15px;">基調</label>
          <select id="story-tone" style="width: 150px; display:inline-block;">
            <option value="普通" selected>普通</option>
            <option value="熱血">熱血</option>
            <option value="搞笑">搞笑</option>
          </select>
          <span style="font-size: 0.85em; color: #a6adc8; margin-left: 10px;">(僅影響開局劇情)</span>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="generate-btn" onclick="window.FamiliarApp.generateContent()">生成內容</button>
          <button class="btn" id="inject-btn" disabled>注入變量並入學</button>
        </div>
      </div>
    </div>

    
</div>
<script>
      // ==========================================
      // 提示詞模板與規則
      // ==========================================
      const PROMPT_BASE = `通用提示詞
你是一個「西方奇幻召喚師學院」世界觀的背景設定與技能生成引擎。
你的唯一任務是根據使用者提供的角色背景，生成對應的設定資料。
絕對不要輸出任何解釋、開場白或 Markdown 標籤，你的回覆必須是純粹且合法的 JSON 格式。`;

      const MAGIC_RULES = `**注意以下設定**:
- 世界設定中，魔法被世界意志所限制，無法用來攻擊，具體限制如下**:
    魔法無法被用來強化身體、強化武器、製造武器、放出攻擊
    魔法製造或附魔的道具一旦被用來攻擊，其魔法效果會完全失效，變成凡物
    召喚來自其他世界的"使魔"的召喚魔法不視為攻擊，但你不用生成
- 世界觀下的常見魔法運用:
    通則: 魔力最好用的地方就是用來解決各種雞毛蒜皮的小事，比如搬重物、找剪刀、摸黑上廁所等。因此過於華麗或宏大的魔法基本不受重視。
    魔法範例:
      微光術: 光屬性。產生如同燭火的光源。
      立足術: 地屬性。產生可以供站立的土塊。
      炎屬性: 暖陽術。在手中產生溫暖的熱量。`;

      window.FamiliarApp = {
        isHuman: true,

        init() {
          document.getElementById("fa-app").querySelectorAll(".nav-btn").forEach((btn) => {
            btn.addEventListener("click", (e) => {
              document.getElementById("fa-app").querySelectorAll(".nav-btn").forEach((b) => b.classList.remove("active"));
              e.target.classList.add("active");
              this.showPage(e.target.dataset.target);
            });
          });
          this.updateRace();
          this.updateRole();
          this.updateContract();

          document.getElementById("inject-btn").addEventListener("click", () => this.injectVariables());
        },

        showPage(target) {
          document.getElementById("fa-app").querySelectorAll(".page").forEach((p) => p.classList.remove("active"));
          let actualTarget = target;
          if (target === "page2") actualTarget = this.isHuman ? "page2-human" : "page2-familiar";
          else if (target === "page3") actualTarget = this.isHuman ? "page3-human" : "page3-familiar";
          else if (target === "page4") this.renderSummary();
          document.getElementById(actualTarget).classList.add("active");
        },

        updateRace() {
          this.isHuman = document.getElementById("fa-app").querySelector('input[name="race"]:checked').value === "human";
          const p2Btn = document.getElementById("fa-app").querySelector('.nav-btn[data-target="page2"]');
          const p3Btn = document.getElementById("fa-app").querySelector('.nav-btn[data-target="page3"]');
          p2Btn.textContent = this.isHuman ? "第二頁：基本資料 (人類)" : "第二頁：基本資料 (使魔)";
          p3Btn.textContent = this.isHuman ? "第三頁：你的使魔" : "第三頁：你的召喚者";
          const activePage = document.getElementById("fa-app").querySelector(".page.active").id;
          if (activePage.startsWith("page2")) this.showPage("page2");
          if (activePage.startsWith("page3")) this.showPage("page3");
        },

        updateRole() {
          const role = document.getElementById("role-select").value;
          const isOther = role === "其他";
          document.getElementById("role-other-container").classList.toggle("hidden", !isOther);
          const isSenior = role === "高年級生";
          document.getElementById("fa-app").querySelectorAll(".grade-container").forEach((el) => {
            el.classList.toggle("hidden", !isSenior);
          });
        },

        updateContract() {
          const hHasContract = document.getElementById("h-contract").value === "有";
          document.getElementById("fs-h-contract").disabled = !hHasContract;
          const fHasContract = document.getElementById("f-contract").value === "有";
          document.getElementById("fs-f-contract").disabled = !fHasContract;
        },

        changeMoney(inputId, amount) {
          const el = document.getElementById(inputId);
          let val = parseInt(el.value) || 0;
          val = Math.max(0, val + amount);
          el.value = val;
        },
        
        checkGenderOther(selectElem, otherInputId) {
          const inputElem = document.getElementById(otherInputId);
          if (selectElem.value === '其他') {
            inputElem.classList.remove('hidden');
          } else {
            inputElem.classList.add('hidden');
            inputElem.value = '';
          }
        },

        getRoleStr() {
          const role = document.getElementById("role-select").value;
          if (role === "其他") return (document.getElementById("role-other-input").value || "未指定");
          return role;
        },

        getGrade() {
          const role = document.getElementById("role-select").value;
          if (role === "新生") return "一";
          if (role === "高年級生") {
            return this.isHuman ? document.getElementById("h-grade").value : document.getElementById("f-grade").value;
          }
          return "無";
        },
        
        getGenderStr(selectId, inputId) {
          const selectVal = document.getElementById(selectId).value;
          if (selectVal === "其他") return document.getElementById(inputId).value || "未填寫";
          return selectVal;
        },

        renderSummary() {
          const container = document.getElementById("summary-list");
          let html = "";
          const roleStr = this.getRoleStr();
          const gradeStr = this.getGrade();
          const isSenior = document.getElementById("role-select").value === "高年級生";

          if (this.isHuman) {
            const genderStr = this.getGenderStr("h-gender", "h-gender-other");
            html += `<p><strong>種族：</strong> 人類</p>`;
            html += `<p><strong>身分：</strong> ${roleStr}</p>`;
            html += `<p><strong>名字：</strong> ${document.getElementById("h-name").value || "未填寫"}</p>`;
            html += `<p><strong>性別：</strong> ${genderStr}</p>`;
            if (isSenior || gradeStr === "一") html += `<p><strong>年級：</strong> ${gradeStr}</p>`;
            html += `<p><strong>人設：</strong> ${document.getElementById("h-persona").value || "未填寫"}</p>`;
            html += `<p><strong>初始金钱：</strong> ${document.getElementById("h-money").value}</p>`;
            html += `<p><strong>當前狀態：</strong> ${document.getElementById("h-status").value || "未填寫"}</p>`;

            const hasContract = document.getElementById("h-contract").value === "有";
            html += `<hr><p><strong>契約使魔：</strong> ${hasContract ? "有" : "無"}</p>`;

            if (hasContract) {
              const cName = document.getElementById("ch-name").value;
              const cTitle = document.getElementById("ch-title").value;
              const cGender = this.getGenderStr("ch-gender", "ch-gender-other");
              const displayCName = cTitle || cName ? `[${cTitle || "無稱號"}] ${cName || "未填寫"}` : "<i>(將由系統隨機生成)</i>";
              html += `<p><strong>使魔名字：</strong> ${displayCName}</p>`;
              if (cName || cTitle) {
                html += `<p><strong>使魔屬性：</strong> ${document.getElementById("ch-element").value}</p>`;
                html += `<p><strong>使魔種族：</strong> ${document.getElementById("ch-race-type").value}</p>`;
                html += `<p><strong>使魔星級：</strong> ${document.getElementById("ch-star").value || "未填寫"}</p>`;
