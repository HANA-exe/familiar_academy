<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>使魔學院入學系統</title>
    <style>
      #fa-app-container {
        --fa-bg-color: #1e1e2e;
        --fa-panel-bg: #2a2a3c;
        --fa-text-color: #cdd6f4;
        --fa-border-color: #45475a;
        --fa-accent-color: #89b4fa;
        --fa-disabled-color: #6c7086;

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--fa-bg-color);
        color: var(--fa-text-color);
        margin: 0;
        display: flex;
        height: 600px;
        overflow: hidden;
        border: 1px solid var(--fa-border-color);
        border-radius: 8px;
        text-align: left;
      }
      #fa-app-container .fa-sidebar {
        width: 200px;
        background-color: var(--fa-panel-bg);
        border-right: 1px solid var(--fa-border-color);
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      #fa-app-container .fa-sidebar button {
        background: none;
        border: none;
        color: var(--fa-text-color);
        padding: 15px 20px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-left 0.2s;
        border-left: 3px solid transparent;
      }
      #fa-app-container .fa-sidebar button:hover {
        background-color: rgba(137, 180, 250, 0.1);
      }
      #fa-app-container .fa-sidebar button.fa-active {
        background-color: rgba(137, 180, 250, 0.2);
        border-left: 3px solid var(--fa-accent-color);
        font-weight: bold;
      }
      #fa-app-container .fa-content {
        flex: 1;
        padding: 30px;
        overflow-y: auto;
      }
      #fa-app-container .fa-page {
        display: none;
        max-width: 600px;
      }
      #fa-app-container .fa-page.fa-active {
        display: block;
      }
      #fa-app-container h1 {
        font-size: 2em;
        margin-top: 0;
        color: var(--fa-accent-color);
      }
      #fa-app-container h2 {
        font-size: 1.5em;
        margin-top: 0;
        border-bottom: 1px solid var(--fa-border-color);
        padding-bottom: 10px;
      }
      #fa-app-container .fa-subtitle {
        font-size: 0.9em;
        color: #a6adc8;
        margin-bottom: 20px;
      }
      #fa-app-container .fa-form-group {
        margin-bottom: 20px;
      }
      #fa-app-container label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }
      #fa-app-container input[type="text"],
      #fa-app-container input[type="number"],
      #fa-app-container select,
      #fa-app-container textarea {
        width: 100%;
        padding: 10px;
        background-color: #181825;
        border: 1px solid var(--fa-border-color);
        color: var(--fa-text-color);
        border-radius: 4px;
        box-sizing: border-box;
      }
      #fa-app-container textarea {
        resize: vertical;
        min-height: 80px;
      }
      #fa-app-container .fa-radio-group {
        display: flex;
        gap: 20px;
        margin-bottom: 10px;
      }
      #fa-app-container .fa-radio-group label {
        display: flex;
        align-items: center;
        font-weight: normal;
        cursor: pointer;
        margin-bottom: 0;
      }
      #fa-app-container .fa-money-input-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #fa-app-container .fa-money-input-group input {
        width: 150px;
        text-align: right;
      }
      #fa-app-container .fa-btn {
        background-color: var(--fa-border-color);
        color: var(--fa-text-color);
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 4px;
        font-family: inherit;
      }
      #fa-app-container .fa-btn:hover {
        background-color: #585b70;
      }
      #fa-app-container .fa-btn:disabled {
        background-color: var(--fa-border-color) !important;
        color: var(--fa-disabled-color) !important;
        cursor: not-allowed;
      }
      #fa-app-container .fa-inline-group {
        display: flex;
        gap: 10px;
      }
      #fa-app-container .fa-actions {
        margin-top: 30px;
        display: flex;
        gap: 15px;
      }
      #fa-app-container .fa-btn-primary {
        background-color: var(--fa-accent-color);
        color: #11111b;
        font-weight: bold;
      }
      #fa-app-container .fa-btn-primary:hover:not(:disabled) {
        background-color: #74c7ec;
      }
      #fa-app-container fieldset {
        border: none;
        padding: 0;
        margin: 0;
      }
      #fa-app-container fieldset:disabled {
        opacity: 0.4;
        pointer-events: none;
      }
      #fa-app-container .fa-hidden {
        display: none !important;
      }
      #fa-summary-list {
        background-color: #181825;
        padding: 20px;
        border-radius: 4px;
        border: 1px solid var(--fa-border-color);
      }
      #fa-summary-list p {
        margin: 10px 0;
      }
      #fa-summary-list strong {
        color: #a6e3a1;
      }
    </style>
  </head>
  <body>
    <div id="fa-app-container">
      <div class="fa-sidebar">
        <button
          class="fa-nav-btn fa-active"
          data-target="fa-page1"
          onclick="window.faApp.handleNavClick(this)"
        >
          第一頁：首頁
        </button>
        <button
          class="fa-nav-btn"
          data-target="fa-page2"
          onclick="window.faApp.handleNavClick(this)"
        >
          第二頁：基本資料
        </button>
        <button
          class="fa-nav-btn"
          data-target="fa-page3"
          onclick="window.faApp.handleNavClick(this)"
        >
          第三頁：契約對象
        </button>
        <button
          class="fa-nav-btn"
          data-target="fa-page4"
          onclick="window.faApp.handleNavClick(this)"
        >
          第四頁：確認入學
        </button>
      </div>

      <div class="fa-content">
        <!-- 第一頁 -->
        <div id="fa-page1" class="fa-page fa-active">
          <h1>
            歡迎入學使魔學院
            <span style="font-size: 0.4em; color: var(--fa-disabled-color)"
              >v4.10</span
            >
          </h1>
          <div class="fa-form-group">
            <label>你真的是人類嗎？</label>
            <div class="fa-radio-group">
              <label
                ><input
                  type="radio"
                  name="fa-race"
                  value="human"
                  checked
                  onchange="window.faApp.updateRace()"
                />
                人類</label
              >
              <label
                ><input
                  type="radio"
                  name="fa-race"
                  value="familiar"
                  onchange="window.faApp.updateRace()"
                />
                使魔</label
              >
            </div>
            <div class="fa-subtitle">
              備註: 根據是否是人類，將影響之後頁面的版本與顯示。
            </div>
          </div>
          <div class="fa-form-group">
            <label>你的身分是？</label>
            <select id="fa-role-select" onchange="window.faApp.updateRole()">
              <option value="新生">新生</option>
              <option value="高年級生">高年級生</option>
              <option value="教師">教師</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="fa-form-group fa-hidden" id="fa-role-other-container">
            <label>請輸入其他身分：</label>
            <input
              type="text"
              id="fa-role-other-input"
              placeholder="例如：校外工友"
            />
          </div>
        </div>

        <!-- 第二頁 (人類版) -->
        <div id="fa-page2-human" class="fa-page">
          <h2>基本資料 (人類)</h2>
          <div class="fa-form-group">
            <label>名字</label><input type="text" id="fa-h-name" />
          </div>
          <div class="fa-form-group">
            <label>性別</label>
            <div class="fa-inline-group">
              <select
                id="fa-h-gender"
                onchange="
                  window.faApp.checkGenderOther(this, 'fa-h-gender-other')
                "
              >
                <option>男</option>
                <option>女</option>
                <option>其他</option>
              </select>
              <input
                type="text"
                id="fa-h-gender-other"
                class="fa-hidden"
                placeholder="請輸入自訂性別"
              />
            </div>
          </div>
          <div class="fa-form-group">
            <label>人設</label><textarea id="fa-h-persona"></textarea>
          </div>
          <div class="fa-form-group fa-grade-container fa-hidden">
            <label>年級</label>
            <select id="fa-h-grade">
              <option>二</option>
              <option>三</option>
              <option>四</option>
              <option>五</option>
              <option>六</option>
            </select>
          </div>
          <div class="fa-form-group">
            <label>初始金錢 (藝齒)</label>
            <div class="fa-money-input-group">
              <button
                class="fa-btn"
                onclick="window.faApp.changeMoney('fa-h-money', -100)"
              >
                -
              </button>
              <input
                type="number"
                id="fa-h-money"
                value="0"
                min="0"
                step="100"
              />
              <button
                class="fa-btn"
                onclick="window.faApp.changeMoney('fa-h-money', 100)"
              >
                +
              </button>
            </div>
          </div>
          <div class="fa-form-group">
            <label>當前狀態</label><input type="text" id="fa-h-status" />
          </div>
          <div class="fa-form-group">
            <label>契約使魔</label>
            <select id="fa-h-contract" onchange="window.faApp.updateContract()">
              <option value="有">有</option>
              <option value="無">無</option>
            </select>
          </div>
        </div>

        <!-- 第二頁 (使魔版) -->
        <div id="fa-page2-familiar" class="fa-page">
          <h2>基本資料 (使魔)</h2>
          <div class="fa-form-group">
            <label>名字 (稱號 與 姓名)</label>
            <div class="fa-inline-group">
              <input type="text" id="fa-f-title" placeholder="稱號" />
              <input type="text" id="fa-f-name" placeholder="姓名" />
            </div>
          </div>
          <div class="fa-form-group">
            <label>屬性</label>
            <select id="fa-f-element">
              <option>地</option>
              <option>水</option>
              <option>炎</option>
              <option>風</option>
              <option>光</option>
              <option>闇</option>
            </select>
          </div>
          <div class="fa-form-group">
            <label>種族</label>
            <select id="fa-f-race-type">
              <option>惡魔</option>
              <option>天使</option>
              <option>機械</option>
              <option>龍</option>
              <option>植物</option>
              <option>爬蟲</option>
              <option>昆蟲</option>
              <option>不死</option>
              <option>雷族</option>
              <option>炎族</option>
              <option>水族</option>
              <option>海龍</option>
              <option>鳥獸</option>
              <option>獸族</option>
              <option>魚族</option>
              <option>幻龍</option>
              <option>恐龍</option>
              <option>魔法使族</option>
              <option>戰士族</option>
            </select>
          </div>
          <div class="fa-form-group">
            <label>星級或階級 (用於分類)</label
            ><input type="text" id="fa-f-star" placeholder="例如：1星、階級1" />
          </div>
          <div class="fa-form-group">
            <label>性別</label>
            <div class="fa-inline-group">
              <select
                id="fa-f-gender"
                onchange="
                  window.faApp.checkGenderOther(this, 'fa-f-gender-other')
                "
              >
                <option>男</option>
                <option>女</option>
                <option>無</option>
                <option>其他</option>
              </select>
              <input
                type="text"
                id="fa-f-gender-other"
                class="fa-hidden"
                placeholder="請輸入自訂性別"
              />
            </div>
          </div>
          <div class="fa-form-group">
            <label>人設</label><textarea id="fa-f-persona"></textarea>
          </div>
          <div class="fa-form-group fa-grade-container fa-hidden">
            <label>年級</label>
            <select id="fa-f-grade">
              <option>二</option>
              <option>三</option>
              <option>四</option>
              <option>五</option>
              <option>六</option>
            </select>
          </div>
          <div class="fa-form-group">
            <label>初始金錢 (藝齒)</label>
            <div class="fa-money-input-group">
              <button
                class="fa-btn"
                onclick="window.faApp.changeMoney('fa-f-money', -100)"
              >
                -
              </button>
              <input
                type="number"
                id="fa-f-money"
                value="0"
                min="0"
                step="100"
              />
              <button
                class="fa-btn"
                onclick="window.faApp.changeMoney('fa-f-money', 100)"
              >
                +
              </button>
            </div>
          </div>
          <div class="fa-form-group">
            <label>當前狀態</label><input type="text" id="fa-f-status" />
          </div>
          <div class="fa-form-group">
            <label>契約召喚者</label>
            <select id="fa-f-contract" onchange="window.faApp.updateContract()">
              <option value="有">有</option>
              <option value="無">無</option>
            </select>
          </div>
        </div>

        <!-- 第三頁 (人類版) -->
        <div id="fa-page3-human" class="fa-page">
          <h2>你的使魔</h2>
          <div class="fa-subtitle">之前選有使魔但這裡沒填，會給你隨機使魔</div>
          <fieldset id="fa-fs-h-contract">
            <div class="fa-form-group">
              <label>名字 (稱號 與 姓名)</label>
              <div class="fa-inline-group">
                <input type="text" id="fa-ch-title" placeholder="稱號" />
                <input type="text" id="fa-ch-name" placeholder="姓名" />
              </div>
            </div>
            <div class="fa-form-group">
              <label>屬性</label>
              <select id="fa-ch-element">
                <option value="未定" selected>未定</option>
                <option>地</option>
                <option>水</option>
                <option>炎</option>
                <option>風</option>
                <option>光</option>
                <option>闇</option>
              </select>
            </div>
            <div class="fa-form-group">
              <label>種族</label>
              <select id="fa-ch-race-type">
                <option value="未定" selected>未定</option>
                <option>惡魔</option>
                <option>天使</option>
                <option>機械</option>
                <option>龍</option>
                <option>植物</option>
                <option>爬蟲</option>
                <option>昆蟲</option>
                <option>不死</option>
                <option>雷族</option>
                <option>炎族</option>
                <option>水族</option>
                <option>海龍</option>
                <option>鳥獸</option>
                <option>獸族</option>
                <option>魚族</option>
                <option>幻龍</option>
                <option>恐龍</option>
                <option>魔法使族</option>
                <option>戰士族</option>
              </select>
            </div>
            <div class="fa-form-group">
              <label>星級或階級 (用於分類)</label
              ><input
                type="text"
                id="fa-ch-star"
                placeholder="例如：1星、階級10"
              />
            </div>
            <div class="fa-form-group">
              <label>性別</label>
              <div class="fa-inline-group">
                <select
                  id="fa-ch-gender"
                  onchange="
                    window.faApp.checkGenderOther(this, 'fa-ch-gender-other')
                  "
                >
                  <option value="未定" selected>未定</option>
                  <option>男</option>
                  <option>女</option>
                  <option>無</option>
                  <option>其他</option>
                </select>
                <input
                  type="text"
                  id="fa-ch-gender-other"
                  class="fa-hidden"
                  placeholder="請輸入自訂性別"
                />
              </div>
            </div>
            <div class="fa-form-group">
              <label>人設與背景</label><textarea id="fa-ch-persona"></textarea>
            </div>
          </fieldset>
        </div>

        <!-- 第三頁 (使魔版) -->
        <div id="fa-page3-familiar" class="fa-page">
          <h2>你的召喚者</h2>
          <div class="fa-subtitle">
            之前選有召喚者但這裡沒填，會給你生成召喚者
          </div>
          <fieldset id="fa-fs-f-contract">
            <div class="fa-form-group">
              <label>名字</label><input type="text" id="fa-cf-name" />
            </div>
            <div class="fa-form-group">
              <label>性別</label>
              <div class="fa-inline-group">
                <select
                  id="fa-cf-gender"
                  onchange="
                    window.faApp.checkGenderOther(this, 'fa-cf-gender-other')
                  "
                >
                  <option value="未定" selected>未定</option>
                  <option>男</option>
                  <option>女</option>
                  <option>其他</option>
                </select>
                <input
                  type="text"
                  id="fa-cf-gender-other"
                  class="fa-hidden"
                  placeholder="請輸入自訂性別"
                />
              </div>
            </div>
            <div class="fa-form-group">
              <label>人設</label><textarea id="fa-cf-persona"></textarea>
            </div>
            <div class="fa-form-group">
              <label>身分</label><input type="text" id="fa-cf-role" />
            </div>
          </fieldset>
        </div>

        <!-- 第四頁 -->
        <div id="fa-page4" class="fa-page">
          <h2>確認個人資料</h2>
          <div id="fa-summary-list"></div>

          <div
            class="fa-form-group"
            style="
              margin-top: 25px;
              display: flex;
              align-items: center;
              gap: 10px;
              flex-wrap: wrap;
            "
          >
            <label style="margin-bottom: 0">基調</label>
            <select id="fa-story-tone" style="width: 100px">
              <option value="普通" selected>普通</option>
              <option value="瑟瑟">瑟瑟</option>
              <option value="搞笑">搞笑</option>
            </select>

            <label style="margin-bottom: 0; margin-left: 10px">結緣角色</label>
            <input
              type="text"
              id="fa-bond-character"
              style="width: 150px"
              placeholder="可留空"
            />

            <span style="font-size: 0.85em; color: #a6adc8; margin-left: 5px"
              >(僅影響開局劇情)</span
            >
          </div>

          <div class="fa-actions">
            <button
              class="fa-btn fa-btn-primary"
              id="fa-generate-btn"
              onclick="window.faApp.generateContent()"
            >
              生成內容
            </button>
            <button
              class="fa-btn"
              id="fa-inject-btn"
              disabled
              onclick="window.faApp.injectVariables()"
            >
              注入變量並入學
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ==========================================
      // 提示詞模板與規則
      // ==========================================
      const FA_PROMPT_BASE = `通用提示詞
你是一個「西方奇幻召喚師學院」世界觀的背景設定與技能生成引擎。
你的唯一任務是根據使用者提供的角色背景，生成對應的設定資料。
絕對不要輸出任何解釋、開場白或 Markdown 標籤，你的回覆必須是純粹且合法的 JSON 格式。`;

      const FA_MAGIC_RULES = `**注意以下設定**:
- 世界設定中，魔法被世界意志所限制，無法用來攻擊，具體限制如下**:
    魔法無法被用來強化身體、強化武器、製造武器、放出攻擊。
    魔法製造或附魔的道具一旦被用來攻擊，其魔法效果會完全失效，變成凡物。
    召喚來自其他世界的"使魔"的召喚魔法不視為攻擊，但你不用生成。
- 世界觀下的常見魔法運用:
    通則: 魔力最好用的地方給是用來解決各種雞毛蒜皮的小事，比如搬重物、找剪刀、摸黑上廁所、清潔等。因此過於華麗或宏大的魔法基本不受重視。
    魔法範例:
      微光術: 光屬性。產生如同燭火的光源。
      立足術: 地屬性。產生可以供站立的土塊。
      炎屬性: 暖陽術。在手中產生溫暖的熱量。`;

      const FA_MAGIC_JSON_EXAMPLE = `"magics": {
  "魔法名": {
    "屬性": "地"|"水"|"炎"|"風"|"光"|"闇",
    "效果": "", // 10~30字的魔法效果介紹
    "描述": "" // 10~20字的魔法定位或背景介紹
  }
}`;

      const FA_ABILITY_JSON_EXAMPLE = `"abilities": {
  "能力名": {
    "類型": "", // 主動或被動
    "效果": "能力效果說明，10~30字",
    "描述": "能力背景敘述，10~20字"
  }
}`;

      const FA_FAMILIAR_PROFILE_EXAMPLE = `"profile": {
  "稱號": "",
  "名字": "",
  "屬性": "地"|"水"|"炎"|"風"|"光"|"闇",

        // 修正屬性，防呆AI亂給雙屬性，且必須滿足 elementEnum
        normalizeElement(elemStr) {
          if (!elemStr) return "地";
          const valid = ["地", "水", "炎", "風", "光", "闇"];
          for (let v of valid) {
            if (String(elemStr).includes(v)) return v;
          }
          return "地";
        },

        // 正規化種族，將提示詞中的「惡魔族」等對齊回 Schema 與 UI 的「惡魔」等
        normalizeRace(raceStr) {
          const validRaces = [
            "惡魔",
            "天使",
            "機械",
            "龍",
            "植物",
            "爬蟲",
            "昆蟲",
            "不死",
            "雷族",
            "炎族",
            "水族",
            "海龍",
            "鳥獸",
            "獸族",
            "魚族",
            "幻龍",
            "恐龍",
            "魔法使族",
            "戰士族",
          ];
          if (!raceStr) return "惡魔";
          const s = String(raceStr).trim();
          if (validRaces.includes(s)) return s;
          const stripped = s.replace(/族$/, "");
          if (validRaces.includes(stripped)) return stripped;
          for (const r of validRaces) {
            if (s.includes(r)) return r;
          }
          return "惡魔";
        },

        normalizeMagics(rawObj) {
          if (!rawObj || typeof rawObj !== "object") return {};
          const result = {};
          for (const [key, val] of Object.entries(rawObj)) {
            if (typeof val === "object" && val !== null) {
              result[key] = {
                屬性: this.normalizeElement(val.屬性),
                層級: 1,
                前置魔法: "",
                效果: String(val.效果 || ""),
                已學習: true,
                描述: String(val.描述 || ""),
              };
            } else if (typeof val === "string") {
              result[key] = {
                屬性: this.normalizeElement(val),
                層級: 1,
                前置魔法: "",
                效果: val,
                已學習: true,
                描述: "",
              };
            }
          }
          return result;
        },

        normalizeAbilities(rawObj) {
          if (!rawObj || typeof rawObj !== "object") return {};
          const result = {};
          for (const [key, val] of Object.entries(rawObj)) {
            if (typeof val === "object" && val !== null) {
              let typeStr = String(val.類型 || "被動");
              result[key] = {
                類型:

                    ? "主動"

                層級: 1,
                前置能力: "",
                效果: String(val.效果 || ""),
                已學習: true,

                層級: 1,
                前置能力: "",
                效果: val,
                已學習: true,
                描述: "",
              };
            }
          }
          return result;
        },

              const cFullName =
                cTitle || cName
                  ? `${cTitle || "無稱號"}-${cName || "未命名"}`
                  : "尚未初始化";
              const cElement = this.normalizeElement(
                document.getElementById("fa-ch-element").value,
              );
              const cRace = this.normalizeRace(
                document.getElementById("fa-ch-race-type").value,
              );
              const cStar =
                document.getElementById("fa-ch-star").value.trim() || "1星";
              const cClass = `${cElement}-${cRace}-${cStar}`;

              if (
                !statData["主角"]["契約使魔"] ||
                typeof statData["主角"]["契約使魔"] === "string"
              ) {
                statData["主角"]["契約使魔"] = this.getEmptyFamiliarBase();
              }

              statData["主角"]["契約使魔"]["名字"] = cFullName;
              statData["主角"]["契約使魔"]["分類"] = cClass;
              statData["主角"]["契約使魔"]["性別"] = this.getGenderStr(
                "fa-ch-gender",
                "fa-ch-gender-other",
              );
              statData["主角"]["契約使魔"]["設定"] =
                document.getElementById("fa-ch-persona").value || "尚未初始化";
              statData["主角"]["契約使魔"]["當前狀態"] = statData["主角"][
                "契約使魔"
              ]["當前狀態"] || { 所在位置: "尚未初始化", 特殊狀態: {} };
              statData["主角"]["契約使魔"]["持有物品"] =
                statData["主角"]["契約使魔"]["持有物品"] || {};
            } else {
              statData["主角"]["契約使魔"] = null;
            }
          } else {
            statData["$主角是否是使魔"] = true;
            const fTitle = document.getElementById("fa-f-title").value.trim();
            const fName = document.getElementById("fa-f-name").value.trim();
            const fFullName =
              fTitle || fName
                ? `${fTitle || "無稱號"}-${fName || "未命名"}`
                : "尚未初始化";
            const fElement = this.normalizeElement(
              document.getElementById("fa-f-element").value,
            );
            const fRace = this.normalizeRace(
              document.getElementById("fa-f-race-type").value,
            );
            const fStar =
              document.getElementById("fa-f-star").value.trim() || "1星";
            const fClass = `${fElement}-${fRace}-${fStar}`;

            statData["主角欄"]["名字"] = fFullName;
            statData["主角欄"]["分類"] = fClass;
            statData["主角欄"]["性別"] = this.getGenderStr(
              "fa-f-gender",
              "fa-f-gender-other",
            );
            statData["主角欄"]["身分"] = roleStr;
            statData["主角欄"]["年級"] = gradeStr;
            statData["主角欄"]["設定"] =
              document.getElementById("fa-f-persona").value || "尚未初始化";

            statData["主角欄"]["當前狀態"] = statData["主角欄"]["當前狀態"] || {
              所在位置: "尚未初始化",
              特殊狀態: {},
            };
            statData["主角欄"]["當前狀態"]["所在位置"] =
              document.getElementById("fa-f-status").value || "尚未初始化";
            statData["主角欄"]["持有藝齒"] =
              parseInt(document.getElementById("fa-f-money").value) || 0;
            if (
              typeof statData["主角欄"]["持有物品"] !== "object" ||
              statData["主角欄"]["持有物品"] === null
            ) {
              statData["主角欄"]["持有物品"] = {};
            }

            const hasContract =
              document.getElementById("fa-f-contract").value === "有";
            statData["主角欄"]["是否有契約召喚者"] = hasContract;

            if (hasContract) {
              const cName =
                document.getElementById("fa-cf-name").value.trim() ||
                "尚未初始化";
              const cRole =
                document.getElementById("fa-cf-role").value.trim() ||
                "尚未初始化";
              const cPersona =
                document.getElementById("fa-cf-persona").value.trim() ||
                "尚未初始化";

              if (
                !statData["主角欄"]["契約召喚者"] ||
                typeof statData["主角欄"]["契約召喚者"] === "string"
              ) {
                statData["主角欄"]["契約召喚者"] = this.getEmptySummonerBase();
              }

              let cGrade = this.cachedGeneratedSummonerGrade || "無";
              if (cRole === "新生") cGrade = "一";
              else if (
                !["一", "二", "三", "四", "五", "六", "無"].includes(cGrade)
              )
                cGrade = "無";

              statData["主角欄"]["契約召喚者"]["名字"] = cName;
              statData["主角欄"]["契約召喚者"]["性別"] = this.getGenderStr(
                "fa-cf-gender",
                "fa-cf-gender-other",
              );
              statData["主角欄"]["契約召喚者"]["身分"] = cRole;
              statData["主角欄"]["契約召喚者"]["年級"] = cGrade;
              statData["主角欄"]["契約召喚者"]["設定"] = cPersona;
              statData["主角欄"]["契約召喚者"]["當前狀態"] = statData["主角欄"][
                "契約召喚者"
              ]["當前狀態"] || { 所在位置: "尚未初始化", 特殊狀態: {} };
              statData["主角欄"]["契約召喚者"]["持有物品"] =
                statData["主角欄"]["契約召喚者"]["持有物品"] || {};
            } else {
              statData["主角欄"]["契約召喚者"] = null;
            }
          }

          _.set(currentData, "stat_data", statData);

          const injBtn = document.getElementById("fa-inject-btn");
          if (injBtn) {
            injBtn.disabled = true;
            injBtn.innerText = "入學中...";
          }

          try {
            await Mvu.replaceMvuData(currentData, mvuContext);
            if (typeof toastr !== "undefined")
              toastr.success("變量已注入！正在生成開局劇情（5秒後觸發）...");

            const hasContractFinal = this.isHuman
              ? document.getElementById("fa-h-contract").value === "有"
              : document.getElementById("fa-f-contract").value === "有";
            const bondChar = document.getElementById("fa-bond-character").value;

            const fa_starting_floor_message = this.generateIntroPrompt(
              this.isHuman,
              roleStr,
              hasContractFinal,
              toneStr,
              bondChar,
            );

            await createChatMessages([
              { role: "user", message: fa_starting_floor_message },
            ]);
            // 使用 STscript 的 /delay 將 5 秒等待與 /trigger 交給 SillyTavern 主執行緒處理，
            // 避免 0 樓介面重繪導致 iframe 內的 setTimeout 被中斷
            if (typeof triggerSlash === "function") {
              await triggerSlash("/delay 5000 | /trigger");
            } else if (
              window.parent &&
              typeof window.parent.triggerSlash === "function"
            ) {
              await window.parent.triggerSlash("/delay 5000 | /trigger");
            }
          } catch (error) {
            console.error("變量注入或觸發開局失敗:", error);
            if (typeof toastr !== "undefined")
              toastr.error("執行失敗，請查看控制台。");
            if (injBtn) {
              injBtn.disabled = false;
              injBtn.innerText = "注入變量並入學";
            }
          }
        },
      });

      // 初始化 (延遲 50ms 確保 DOM 已渲染完畢)
      setTimeout(() => {
        if (window.faApp && typeof window.faApp.init === "function") {
          window.faApp.init();
        }
      }, 50);
    </script>
  </body>
</html>
